<!DOCTYPE html>
<html>
<head>
    <title>Space Telescopes Gallery</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        .gallery {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            width: 280px;
        }

        .card img {
            height: 200px;
            width: auto;
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        .caption {
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Space Telescopes Gallery</h1>

    <div class="gallery">
        <!-- Image 1: Public Domain -->
        <div class="card">
            <img src="https://live.staticflickr.com/1446/27946391011_d103eddf1f_b.jpg" height="200" alt="Hubble Space Telescope">
            <div class="caption">
                <p><b>Hubble Space Telescope</b></p>
                <p>License: Public Domain (NASA)</p>
                <p><a href="https://www.flickr.com/photos/nasahubble/27946391011" target="_blank">View Source Page</a></p>
            </div>
        </div>

        <!-- Image 2: Creative Commons -->
        <div class="card">
            <img src="https://live.staticflickr.com/8327/8086024419_3e51f88046_b.jpg" height="200" alt="Very Large Array">
            <div class="caption">
                <p><b>Very Large Array</b></p>
                <p>License: CC BY 2.0 (Photo by John Fowler)</p>
                <p><a href="https://www.flickr.com/photos/johnfowlerlinks/8086024419/" target="_blank">View Source Page</a></p>
            </div>
        </div>

        <!-- Image 3: Creative Commons / Public Domain -->
        <div class="card">
            <img src="https://live.staticflickr.com/4183/34590599211_b32400e952_b.jpg" height="200" alt="James Webb Space Telescope">
            <div class="caption">
                <p><b>James Webb Space Telescope</b></p>
                <p>License: CC BY 2.0 / Public Domain</p>
                <p><a href="https://www.flickr.com/photos/25182135@N08/34590599211/" target="_blank">View Source Page</a></p>
            </div>
        </div>
    </div>

</body>
</html>
