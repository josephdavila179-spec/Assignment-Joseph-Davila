<!DOCTYPE html>
<html>
<head>
    <title>Space Telescopes Gallery</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            width: 280px;
        }

        .card img {
            height: 200px;
            width: auto;
        }

        .caption {
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Space Telescopes Gallery</h1>

    <div class="gallery">
        <!-- Image 1: Public Domain -->
        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/James_Webb_Space_Telescope.jpg" height="200" alt="James Webb Space Telescope">
            <div class="caption">
                <p><b>James Webb Space Telescope</b></p>
                <p>License: Public Domain (NASA)</p>
                <p><a href="https://commons.wikimedia.org/wiki/File:James_Webb_Space_Telescope.jpg" target="_blank">Original Source</a></p>
            </div>
        </div>

        <!-- Image 2: Creative Commons -->
        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Very_Large_Array%2C_2012.jpg" height="200" alt="Very Large Array">
            <div class="caption">
                <p><b>Very Large Array</b></p>
                <p>License: CC BY 2.0 (Photo by John Fowler)</p>
                <p><a href="https://commons.wikimedia.org/wiki/File:Very_Large_Array,_2012.jpg" target="_blank">Original Source</a></p>
            </div>
        </div>

        <!-- Image 3: Public Domain -->
        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Hubble_01_Cropped.jpg" height="200" alt="Hubble Space Telescope">
            <div class="caption">
                <p><b>Hubble Space Telescope</b></p>
                <p>License: Public Domain (NASA)</p>
                <p><a href="https://commons.wikimedia.org/wiki/File:Hubble_01_Cropped.jpg" target="_blank">Original Source</a></p>
            </div>
        </div>
    </div>

</body>
</html>
